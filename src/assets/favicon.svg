<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=swap');
      .logo-m, .logo-h { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 88px; }
    </style>
  </defs>
  <g transform="translate(10, 10)">
    <!-- M -->
    <text x="0" y="82" class="logo-m" fill="#1a73e8">M</text>
    <!-- H -->
    <text x="85" y="82" class="logo-h" fill="#1a73e8">H</text>
    
    <!-- Rod of Asclepius -->
    <!-- Staff -->
    <line x1="127" y1="12" x2="127" y2="88" stroke="#0a2540" stroke-width="5" stroke-linecap="round"/>
    <!-- Small sphere on top of staff -->
    <circle cx="127" cy="8" r="4.5" fill="#0a2540"/>
    <!-- Coiling Snake -->
    <path d="M 127 80 C 137 75, 137 68, 127 63 C 117 58, 117 51, 127 46 C 137 41, 137 34, 127 29 C 117 24, 120 18, 127 18" 
          fill="none" stroke="#00b4d8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
